groups:
  - name: smart-home-container-alerts
    rules:
      - alert: CAdvisorTargetDown
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CAdvisor ist nicht erreichbar"
          description: "Prometheus kann CAdvisor seit mindestens 1 Minute nicht scrapen. Container-Metriken fehlen."

      - alert: NodeDown
        expr: up{job="node-exporter-demo"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node ist down"
          description: "Der Node {{ $labels.instance }} ist seit mindestens 1 Minute nicht erreichbar."

      - alert: ContainerNotResponding
        expr: time() - container_last_seen{job="cadvisor", id!="/"} > 60
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Container reagiert nicht"
          description: "Container oder CGroup {{ $labels.id }} wurde seit mehr als 1 Minute nicht mehr von CAdvisor gesehen."
