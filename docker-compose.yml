services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - m321-sensors

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-mqtt-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - m321-sensors

  bash-sensoren:
    build:
      context: ./bash-sensoren
    networks:
      - m321-sensors

  java-sensoren:
    build:
      context: ./java-sensoren
    networks:
      - m321-sensors

  demo1:
    image: prom/node-exporter:v1.7.0
    container_name: demo1
    networks:
      - m321-sensors

  demo2:
    image: prom/node-exporter:v1.7.0
    container_name: demo2
    networks:
      - m321-sensors

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-lifecycle
    volumes:
      - ./prom_conf/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prom_conf/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    networks:
      - m321-sensors

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
    volumes:
      - ./prom_conf/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    networks:
      - m321-sensors

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - m321-sensors
    privileged: true

volumes:
  mosquitto-data:
  mosquitto-log:
  grafana-data:
  prometheus-data:

networks:
  m321-sensors:
