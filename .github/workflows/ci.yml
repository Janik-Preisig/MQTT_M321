name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and integration test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show tool versions
        run: |
          docker --version
          docker compose version
          java -version
          mvn --version

      - name: Check repository text rules
        run: |
          bad_char="$(printf '\303\237')"
          if grep -RIl --exclude-dir=.git --exclude-dir=target --exclude='*.png' "$bad_char" .; then
            echo "Fehler: Repository enthaelt ein verbotenes Eszett-Zeichen."
            exit 1
          fi

      - name: Java unit tests
        run: mvn -f java-sensoren/pom.xml test

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Run MQTT stack integration test
        run: bash tests/test-mqtt-stack.sh

      - name: Validate Load Balancing Docker Compose
        run: docker compose -f load-balancing/docker-compose.yml config --quiet

      - name: Build Load Balancing Docker images
        run: docker compose -f load-balancing/docker-compose.yml build

      - name: Run Load Balancing smoke test
        run: |
          cd load-balancing
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              break
            fi
            sleep 2
          done
          sh scripts/request-loop.sh http://localhost:8080/ 5 0.1 | tee /tmp/load-balancing-output.txt
          grep -E "web-a|web-b|web-c" /tmp/load-balancing-output.txt

      - name: Stop Load Balancing stack
        if: always()
        run: docker compose -f load-balancing/docker-compose.yml down -v --remove-orphans

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
